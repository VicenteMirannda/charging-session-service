spring.application.name=microservico_Simulacao_de_Carregamento
server.port=8012
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka

## Configuring info endpoint for Atuator
info.app.name=microservico-frontend-server
info.app.description=This is my first spring boot microservice: microservico-frontend-server
info.app.version=1.0

## Expose all actuator endpoints
management.endpoints.web.exposure.include=*

## Expose info Environment Variable
management.info.env.enabled = true
info.java-vendor = ${java.specification.vendor}
management.endpoint.health.show-details=always

## Base de dados H2


spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=admin
spring.datasource.password=admin
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.datasource.url=jdbc:h2:mem:sessoes-carregamento
spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true
spring.jpa.properties.hibernate.show_sql = true
spring.jpa.properties.hibernate.formate_sql=true
spring.sql.init.mode=always







feign.hystrix.enabled=true

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
spring.web.resources.add-mappings=true

