spring.application.name=charging-session-service
server.port=8012

# Without an explicit profile the service runs in "standalone" mode, using in-memory
# fakes instead of the real charging-point and vehicle microservices.
spring.profiles.default=standalone

# Base URLs of the microservices this service depends on (used outside standalone mode)
clients.charging-point-service.url=http://localhost:8030
clients.vehicle-service.url=http://localhost:8010

# Database (in-memory H2)
spring.datasource.url=jdbc:h2:mem:charging-sessions
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
